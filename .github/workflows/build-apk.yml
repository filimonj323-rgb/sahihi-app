name: Jenga APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Chukua code
        uses: actions/checkout@v4

      - name: Weka Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Weka Java (kwa Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sakinisha dependencies
        run: npm install

      - name: Ongeza jukwaa la Android
        run: npx cap add android

      - name: Sync www ndani ya Android
        run: npx cap sync android

      - name: Ruhusu gradlew kuendesha
        run: chmod +x android/gradlew

      - name: Jenga APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Pakia APK (utaipakua hapa)
        uses: actions/upload-artifact@v4
        with:
          name: sahihi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
